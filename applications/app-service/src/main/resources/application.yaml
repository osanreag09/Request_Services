server:
  port: 8081
spring:
  application:
    name: "RequestService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: users_db
    schema: public
    username: admin
    password: admin123
    pool:
      initial-size: 5
      max-size: 20
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: true
    url: /v3/api-docs/public-apis
    tags-sorter: alpha
    doc-expansion: none
    try-it-out-enabled: true
  show-actuator: true
  cache:
    disabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  model-and-view-allowed: false
  override-with-generic-response: false
  use-fqn: false

auth:
  service:
    base-url: http://localhost:8080

jwt:
  secret: AeR9$kL2#pQ7*mN5&vX8!zD4%fG6@hJ3  #${JWT_SECRET} #tu_clave_secreta_muy_larga_y_segura_aqui_1234567890

aws:
  region: us-east-1
  endpoint: http://localhost:4566
  credentials:
    access-key: test
    secret-key: test
  sqs:
    #queue-url: "http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/my-queue"
    queue-url: "http://localhost:4566/000000000000/my-queue"
  sns:
    topic-arn: arn:aws:sns:us-east-1:000000000000:my-topic